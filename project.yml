name: WhateverClock

options:
  bundleIdPrefix: de.marc-hein
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.6"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.2"
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: UJR28ZV94C
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    GCC_C_LANGUAGE_STANDARD: gnu17
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

targets:
  WhateverClock:
    type: application
    platform: iOS
    sources:
      - path: WhateverClock
        excludes:
          - "WhateverClock.entitlements"
    dependencies:
      - target: WhateverClockWidget
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.marc-hein.WhateverClock
        PRODUCT_NAME: WhateverClock
        CODE_SIGN_ENTITLEMENTS: WhateverClock/WhateverClock.entitlements
        REGISTER_APP_GROUPS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        # Minimum OS when running as "Designed for iPhone/iPad" on Mac and Vision Pro
        MACOSX_DEPLOYMENT_TARGET: "26.2"
        XROS_DEPLOYMENT_TARGET: "26.2"
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WhateverClock
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchStoryboardName: Launch Screen.storyboard
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  WhateverClockWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WhateverClockWidget
        excludes:
          - "WhateverClockWidget.entitlements"
          - "WhateverClockWidgetInfo.plist"
      # Code shared with the app
      - path: WhateverClock/Extensions/Color+Hex.swift
      - path: WhateverClock/Shared/ClockSettings.swift
      - path: WhateverClock/Shared/ClockHandAngles.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.marc-hein.WhateverClock.WhateverClockWidget
        PRODUCT_NAME: WhateverClockWidget
        CODE_SIGN_ENTITLEMENTS: WhateverClockWidget/WhateverClockWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WhateverClockWidget/WhateverClockWidgetInfo.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../../Frameworks"
        SKIP_INSTALL: YES

  WhateverClockTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WhateverClockTests
    dependencies:
      - target: WhateverClock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.marc-hein.WhateverClockTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WhateverClock.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/WhateverClock"

  WhateverClockUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - WhateverClockUITests
    dependencies:
      - target: WhateverClock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.marc-hein.WhateverClockUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        TEST_TARGET_NAME: WhateverClock

schemes:
  WhateverClock:
    build:
      targets:
        WhateverClock: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - WhateverClock
      targets:
        - name: WhateverClockTests
          parallelizable: true
        - name: WhateverClockUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  WhateverClockWidget:
    build:
      targets:
        WhateverClockWidget: all
        WhateverClock: all
    run:
      config: Debug
      executable: WhateverClock
      environmentVariables:
        _XCWidgetKind: ""
        _XCWidgetDefaultView: timeline
        _XCWidgetFamily: systemSmall
    archive:
      config: Release
